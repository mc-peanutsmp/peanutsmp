    <script>
(function () {
  function showModal(el) {
    if (window.jQuery && jQuery.fn && jQuery.fn.modal) {
      jQuery(el).modal('show');
      return true;
    }

    if (window.bootstrap && bootstrap.Modal) {
      bootstrap.Modal.getOrCreateInstance(el).show();
      return true;
    }

    return false;
  }

  function tryOpenFromHash() {
    var hash = window.location.hash;
    if (!hash) return false;

    var el = document.querySelector(hash);
    if (!el) return false;

    if (!el.classList.contains('modal')) return false;

    return showModal(el);
  }

  function openWithRetry(maxMs) {
    var start = Date.now();

    function tick() {
      if (tryOpenFromHash()) return;

      if (Date.now() - start < maxMs) {
        setTimeout(tick, 100);
      }
    }

    tick();
  }

  document.addEventListener('DOMContentLoaded', function () {
    openWithRetry(4000);
    
    // IP Copy Functionality
    var copyBox = document.getElementById('copy');
    if (copyBox) {
      copyBox.addEventListener('click', function () {
        var ipText = this.getAttribute('data-clipboard-text');
        navigator.clipboard.writeText(ipText).then(function () {
          var tooltipSpan = copyBox.querySelector('.custom-tooltip span');
          if (tooltipSpan) {
            var originalText = tooltipSpan.textContent;
            tooltipSpan.textContent = "COPIED!";
            setTimeout(function () {
              tooltipSpan.textContent = originalText;
            }, 1500);
          }
        });
      });
    }

    // Fetch Live Discord Member Count
    var serverId = "1550532723465125908";
    if (serverId) {
      fetch("https://discord.com/api/guilds/" + serverId + "/widget.json")
        .then(function (response) {
          return response.json();
        })
        .then(function (data) {
          if (data && data.presence_count !== undefined) {
            var countEl = document.getElementById("discord-member-count");
            if (countEl) {
              countEl.textContent = data.presence_count.toLocaleString();
            }
          }
        })
        .catch(function (error) {
          console.error("Error fetching discord count:", error);
        });
    }
  });

  window.addEventListener('hashchange', function () {
    openWithRetry(2000);
  });
})();
  </script>
